AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Image Resizer API compute - internet-facing ALB reachable only from CloudFront,
  an Auto Scaling group of hardened Amazon Linux 2023 instances in private
  subnets (no SSH, IMDSv2, SSM-managed), and the private release artifact bucket.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: '^[a-z][a-z0-9-]{1,20}$'
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets (different AZs) for the load balancer.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for instances. They need outbound HTTPS (NAT gateway or VPC endpoints for S3/SSM plus nodejs.org).
  OriginCertificateArn:
    Type: String
    Description: Regional ACM certificate for the origin domain CloudFront connects to (e.g. origin.example.com).
    AllowedPattern: '^arn:aws[a-z-]*:acm:[a-z0-9-]+:\d{12}:certificate/.+$'
  CloudFrontPrefixListId:
    Type: String
    Description: >-
      ID of the AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region
      (aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing).
    AllowedPattern: '^pl-[0-9a-f]+$'
  InstanceType:
    Type: String
    Default: t4g.medium
    Description: Graviton (arm64) by default. Match AmiId's architecture.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  MinSize:
    Type: Number
    Default: 0
    Description: Start at 0, run the deploy pipeline once (it publishes the first release), then raise to >= 2.
  MaxSize:
    Type: Number
    Default: 4
  DesiredCapacity:
    Type: Number
    Default: 0
  SsmParameterPath:
    Type: String
    Default: /image-resizer/prod
    AllowedPattern: '^/[a-zA-Z0-9_/-]+[a-zA-Z0-9_-]$'
    Description: Parameter Store path holding the API environment variables (one parameter per variable).

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-releases
            Status: Enabled
            Prefix: releases/image-resizer-
            ExpirationInDays: 180
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTPS from CloudFront origin-facing IPs only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing
      Tags:
        - { Key: Name, Value: !Sub 'image-resizer-${EnvironmentName}-alb' }

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API instances - HTTP from the ALB only; no SSH (use SSM Session Manager)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: nginx from ALB
      Tags:
        - { Key: Name, Value: !Sub 'image-resizer-${EnvironmentName}-instance' }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: least-privilege-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadReleases
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${ArtifactBucket.Arn}/releases/*'
                  - !Sub '${ArtifactBucket.Arn}/bootstrap/*'
              - Sid: ReadConfiguration
                Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameters, ssm:GetParameter]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}/*'
              - Sid: FeedbackTable
                Effect: Allow
                # TransactWriteItems is authorised per underlying action.
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:ConditionCheckItem]
                Resource:
                  - !GetAtt FeedbackTable.Arn
                  - !Sub '${FeedbackTable.Arn}/index/*'

  # Reviews and ratings, shared by all instances. Same layout as single-server.yaml.
  FeedbackTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: App, Value: image-resizer }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required # IMDSv2 only
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 16
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - { Key: App, Value: image-resizer }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            install -d -m 0750 /etc/image-resizer
            cat > /etc/image-resizer/deploy.conf <<'EOF'
            ARTIFACT_BUCKET=${ArtifactBucket}
            SSM_PATH=${SsmParameterPath}
            AWS_REGION=${AWS::Region}
            FEEDBACK_TABLE=${FeedbackTable}
            NGINX_PROFILE=alb
            EOF
            chmod 0640 /etc/image-resizer/deploy.conf
            aws s3 cp --only-show-errors --region ${AWS::Region} s3://${ArtifactBucket}/bootstrap/bootstrap.sh /root/image-resizer-bootstrap.sh
            bash /root/image-resizer-bootstrap.sh

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '35'

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: idle_timeout.timeout_seconds
          Value: '90'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref OriginCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M
    Properties:
      VPCZoneIdentifier: !Ref PrivateSubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 420
      Tags:
        - { Key: Name, Value: !Sub 'image-resizer-${EnvironmentName}', PropagateAtLaunch: true }
        # The deploy pipeline targets SSM Run Command at these two tags.
        - { Key: App, Value: image-resizer, PropagateAtLaunch: true }
        - { Key: Environment, Value: !Ref EnvironmentName, PropagateAtLaunch: true }

  CpuTargetTracking:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60

Outputs:
  ArtifactBucketName:
    Description: GitHub variable ARTIFACT_BUCKET.
    Value: !Ref ArtifactBucket
  FeedbackTableName:
    Value: !Ref FeedbackTable
  LoadBalancerDNSName:
    Description: Create a DNS record for the origin domain (e.g. origin.example.com) pointing here; use that name as ApiOriginDomainName in the edge stack.
    Value: !GetAtt LoadBalancer.DNSName
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn
