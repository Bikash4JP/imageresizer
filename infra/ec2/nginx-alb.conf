# /etc/nginx/conf.d/image-resizer.conf — NGINX_PROFILE=alb (high-availability stack).
#
# Traffic path: viewer -> CloudFront (TLS) -> ALB (TLS, ACM) -> nginx :80 -> Node 127.0.0.1:8080
# The instance sits in a private subnet and its security group only admits the ALB.
# The single-server stack uses nginx-tls.conf instead.

server_tokens off;

upstream image_resizer_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Upload ceiling: MAX_UPLOAD_MB (25) + multipart overhead. Oversized bodies
    # are refused here, before they reach Node.
    client_max_body_size 26m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    # Buffer the full upload before proxying, so slow clients tie up nginx
    # (cheap) rather than a Node worker. Buffers go to nginx's private temp dir.
    proxy_request_buffering on;
    client_body_buffer_size 1m;

    location = /api/v1/health {
        proxy_pass http://image_resizer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location /api/ {
        proxy_pass http://image_resizer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        # Processed images are streamed back as produced.
        proxy_buffering off;
    }

    # The SPA is served from S3 via CloudFront; nothing else lives here.
    location / {
        return 404;
    }
}
