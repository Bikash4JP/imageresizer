# /etc/nginx/conf.d/image-resizer.conf — NGINX_PROFILE=tls (single-server stack).
#
# Traffic path: viewer -> CloudFront (TLS) -> nginx :443 (Let's Encrypt, origin.<domain>) -> Node 127.0.0.1:8080
# The security group admits 443 only from CloudFront's origin-facing IP ranges,
# and the app additionally requires CloudFront's X-Origin-Verify secret.
# Port 80 is not open at all: certificates are issued with the DNS-01 challenge.

server_tokens off;

upstream image_resizer_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/origin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Upload ceiling: MAX_UPLOAD_MB (25) + multipart overhead. Oversized bodies
    # are refused here, before they reach Node.
    client_max_body_size 26m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    # Buffer the full upload before proxying, so slow clients tie up nginx
    # (cheap) rather than a Node worker.
    proxy_request_buffering on;
    client_body_buffer_size 1m;

    location = /api/v1/health {
        proxy_pass http://image_resizer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location /api/ {
        proxy_pass http://image_resizer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # The SPA is served from S3 via CloudFront; nothing else lives here.
    location / {
        return 404;
    }
}
